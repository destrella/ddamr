[workspace]
members = [
    "crates/ddamr-core",
    "crates/ddamr-db",
    "crates/ddamr-fs",
    "crates/ddamr-metadata",
    "crates/ddamr-media",
    "crates/ddamr-index",
    "crates/ddamr-app",
    "crates/ddamr-cli",
]
resolver = "2"

# Dependencias compartidas: una sola versión en todo el workspace.
# (serde_json y tracing se añaden aquí cuando un crate los use de verdad.)
[workspace.dependencies]
ddamr-core = { path = "crates/ddamr-core" }
ddamr-db = { path = "crates/ddamr-db" }
ddamr-fs = { path = "crates/ddamr-fs" }
ddamr-metadata = { path = "crates/ddamr-metadata" }
ddamr-media = { path = "crates/ddamr-media" }
ddamr-index = { path = "crates/ddamr-index" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
wait-timeout = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
image = { version = "0.25", features = ["jpeg", "png"] }
